<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI 回复</title>
  <style>
    :root{--c-black:#171717;--c-white:#fff;--c-gray:#707070;--c-light-blue:#9bdcff;--c-bg:var(--c-white);--c-panel:var(--c-white);--c-card:var(--c-white);--c-card-hover:var(--c-light-blue);--c-border:rgba(112,112,112,.48);--c-text:var(--c-black);--c-strong:var(--c-black);--c-muted:var(--c-gray);--c-accent:var(--c-light-blue);--c-accent-bg:var(--c-light-blue);--c-accent-hover:var(--c-light-blue)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;color-scheme:light}body{padding:9px 8px 8px;background:var(--c-bg);color:var(--c-text);font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
    .reply-card{position:relative;width:100%;height:100%;min-width:0;display:flex;flex-direction:column;padding:10px;border:1px solid var(--c-border);border-radius:10px;background:var(--c-panel);box-shadow:0 8px 24px rgba(23,23,23,.14)}.reply-tail{position:absolute;top:-8px;left:calc(50% - 7px);width:14px;height:14px;border-left:1px solid var(--c-border);border-top:1px solid var(--c-border);background:var(--c-panel);transform:rotate(45deg)}
    .reply-head{display:flex;align-items:center;min-width:0;gap:8px;margin-bottom:8px}.reply-heading{flex:1;min-width:0}.reply-title{color:var(--c-black);font-weight:700;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reply-meta{margin-top:2px;color:var(--c-muted);font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close-btn{flex:0 0 28px;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--c-black);cursor:pointer;font-size:19px;line-height:1}.close-btn:hover{border-color:var(--c-border);background:var(--c-card-hover);color:var(--c-black)}
    .reply-content{flex:1;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:11px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-card);color:var(--c-black);font-size:13px;line-height:1.7;white-space:normal;overflow-wrap:anywhere;word-break:break-word;tab-size:2;user-select:text;scrollbar-width:thin}.reply-content .ai-teaching-line{min-height:1.7em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.reply-content .ai-teaching-line-empty{min-height:.75em}.reply-content .ai-teaching-formula-label{margin-top:4px;font-weight:700}.reply-content .ai-teaching-formula-source{margin:6px 0;padding:7px 8px;border:1px solid var(--c-border);border-radius:7px;background:var(--c-white);overflow-x:auto;text-align:center;white-space:normal;scrollbar-width:none}.reply-content .ai-teaching-formula-source::-webkit-scrollbar,.reply-content mjx-container::-webkit-scrollbar{display:none;width:0;height:0}.reply-content mjx-container[jax="SVG"]{max-width:100%;color:var(--c-black)}.reply-content mjx-container[jax="SVG"][display="true"]{display:block;max-width:100%;margin:6px 0;padding:7px;border:1px solid var(--c-border);border-radius:7px;background:var(--c-white);overflow-x:auto;scrollbar-width:none}.reply-content .ai-teaching-formula-source mjx-container[jax="SVG"][display="true"]{margin:0;padding:0;border:0;border-radius:0}.reply-content mjx-container[jax="SVG"][display="true"]>svg{display:block;max-width:100%;height:auto;margin:0 auto}.reply-actions{display:flex;align-items:center;min-width:0;gap:8px;margin-top:8px}.copy-status{flex:1;min-width:0;color:var(--c-muted);font-size:10px;line-height:1.35;white-space:normal}.action-buttons{display:flex;align-items:center;flex:0 0 auto;gap:6px}.reply-shortcut{padding:2px 6px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-card);color:var(--c-muted);font-size:9px;line-height:1.5}.copy-btn{flex:0 0 auto;min-width:76px;height:30px;padding:0 11px;border:1px solid var(--c-gray);border-radius:7px;background:var(--c-accent-bg);color:var(--c-black);cursor:pointer;font-size:11px;font-weight:700}.copy-btn:hover{background:var(--c-accent-hover)}.copy-btn:disabled{cursor:default;opacity:.5}
    .reply-content{scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;scrollbar-gutter:auto}.reply-scroll-progress{height:2px;flex:0 0 2px;margin:-3px 2px 5px;overflow:hidden;border-radius:999px;background:var(--c-white)}.reply-scroll-progress>span{display:block;width:100%;height:100%;background:var(--c-accent);transform:scaleX(0);transform-origin:left center;transition:transform 120ms linear}.scroll-top-btn{height:30px;min-width:42px;padding:0 8px;border:1px solid var(--c-border);border-radius:7px;background:var(--c-card);color:var(--c-text);cursor:pointer;font-size:10px}.scroll-top-btn:hover{border-color:var(--c-gray);background:var(--c-card-hover);color:var(--c-black)}.close-btn:focus-visible,.copy-btn:focus-visible,.scroll-top-btn:focus-visible,.reply-content:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}::selection{background:var(--c-accent-bg);color:var(--c-black)}*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}@media(prefers-reduced-motion:reduce){.reply-content{scroll-behavior:auto}.reply-scroll-progress>span{transition:none}}
  </style>
  <link rel="stylesheet" href="../shared/math-renderer.css">
</head>
<body>
  <main class="reply-card" role="dialog" aria-labelledby="replyTitle">
    <div class="reply-tail"></div>
    <div class="reply-head"><div class="reply-heading"><div class="reply-title" id="replyTitle">AI 回复</div><div class="reply-meta" id="replyMeta">正在读取回复</div></div><button class="close-btn" id="closeBtn" type="button" aria-label="关闭回复">&#215;</button></div>
    <div class="reply-scroll-progress" id="replyScrollProgress" role="progressbar" aria-label="AI回复阅读进度" hidden><span></span></div>
    <div class="reply-content math-render-surface" id="replyContent" tabindex="0" role="document" aria-label="AI 回复正文和公式图像，可使用滚轮、触控板或键盘翻页">正在读取回复...</div>
    <div class="reply-actions"><div class="copy-status" id="copyStatus" role="status" aria-live="polite">可选择文字，或一键复制完整回复</div><div class="action-buttons"><button class="scroll-top-btn" id="replyScrollTopBtn" type="button" aria-controls="replyContent" hidden>回顶</button><div class="reply-shortcut" aria-label="复制快捷键 Alt 加 M">Alt+M</div><button class="copy-btn" id="copyBtn" type="button" disabled>复制回复</button></div></div>
  </main>
  <script src="../shared/scroll-surface.js"></script>
  <script src="../shared/math-renderer.js"></script>
  <script src="ai-reply.js"></script>
</body>
</html>
